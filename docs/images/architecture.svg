<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="890" viewBox="0 0 1280 890" role="img" aria-labelledby="title desc">
<title id="title">yours — Google Cloud architecture</title><desc id="desc">Users approve bounded AI permissions. Gemini on Vertex AI uses typed tools through a public Cloud Run API. Private mandate and payment services verify consent, persist transactions, and use Cloud HSM. Polygon Amoy contracts enforce budgets before spending from the user's wallet.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6d8175"/></marker></defs>
<style>text{font-family:Arial,'Hiragino Kaku Gothic ProN',sans-serif;fill:#233f35}.title{font-size:32px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#62756c}.box{fill:#fff;stroke:#d4dfd7;stroke-width:1.5;rx:14}.line{fill:none;stroke:#6d8175;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1280" height="890" fill="#f6f8f2"/><text x="40" y="55" class="title">yours</text><text x="166" y="54" class="h">AI works for you.</text><text x="40" y="87" class="b">本人が決めた範囲で、AIが購入する。資産と最終的な決定権は本人に。</text>
<rect x="34" y="122" width="270" height="126" class="box"/><text x="55" y="154" class="h">本人のブラウザ・wallet</text><text x="55" y="186" class="b">AI / 店舗 / 上限 / 期限を承認</text><text x="55" y="216" class="s">SIWE・EIP-712 / owner秘密鍵を保持</text>
<rect x="34" y="295" width="270" height="112" class="box"/><text x="55" y="329" class="h">外部のAIサービス</text><text x="55" y="358" class="b">UCP client + AP2 holder</text><text x="55" y="384" class="s">AI独自の署名鍵 / ownerの鍵は不要</text>
<rect x="348" y="118" width="896" height="550" rx="20" fill="#eef4ff" stroke="#b9cbe7"/><text x="374" y="151" class="h">Google Cloud · yours-511602</text><text x="942" y="151" class="s">Cloud Run / asia-northeast1</text>
<rect x="374" y="175" width="315" height="147" class="box"/><text x="397" y="206" class="h">Public API / Console</text><text x="397" y="237" class="b">UCP discovery → checkout → order</text><text x="397" y="265" class="b">本人認証・共有予算・監査履歴</text><text x="397" y="294" class="s">HTTP署名 / webhook / x402</text>
<rect x="880" y="175" width="337" height="147" class="box"/><text x="903" y="206" class="h">Gemini + Google ADK</text><text x="903" y="237" class="b">Vertex AI / gemini-3.8-flash</text><text x="903" y="266" class="b">商品検索・承認済み購入の実行</text><text x="903" y="294" class="s">Private Run · DB・署名鍵にアクセスなし</text>
